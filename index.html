<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>브랜드 매장 현황판</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#12161a; --panel:#181e24; --panel-2:#1f272f; --line:#2a333c;
    --ink:#e9e6dd; --muted:#8b93a0; --amber:#d9a441; --amber-dim:#8a6a2e;
    --wellounge:#5b8fa8; --wellcafe:#c97b4a; --celunic:#7a9e73; --naviel:#b06a7a; --club:#8d78b0;
    --closed:#5a6068;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans KR',sans-serif;overflow:hidden;}
  #app{display:grid;grid-template-columns:380px 1fr;height:100vh;}
  #sidebar{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0;}
  #head{padding:20px 20px 14px;border-bottom:1px solid var(--line);}
  #head .eyebrow{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.14em;color:var(--amber);text-transform:uppercase;}
  #head h1{font-size:19px;margin:6px 0 2px;font-weight:600;letter-spacing:-.01em;}
  #head .sub{font-size:12px;color:var(--muted);}
  #stats{display:flex;border-bottom:1px solid var(--line);}
  .stat{flex:1;padding:12px 12px;border-right:1px solid var(--line);}
  .stat:last-child{border-right:none;}
  .stat .n{font-family:'IBM Plex Mono',monospace;font-size:17px;font-weight:600;color:var(--amber);}
  .stat .l{font-size:10px;color:var(--muted);margin-top:2px;}
  #controls{padding:12px 20px;border-bottom:1px solid var(--line);}
  #search{width:100%;background:var(--panel-2);border:1px solid var(--line);color:var(--ink);padding:8px 10px;border-radius:5px;font-size:13px;font-family:inherit;}
  #search:focus{outline:none;border-color:var(--amber-dim);}
  #brandFilters{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}
  .chip{font-size:11px;padding:4px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted);cursor:pointer;user-select:none;font-family:'IBM Plex Mono',monospace;transition:all .12s;}
  .chip.active{color:#12161a;border-color:transparent;}
  .toggle-row{display:flex;align-items:center;justify-content:space-between;margin-top:10px;font-size:12px;color:var(--muted);}
  .toggle-row input{accent-color:var(--amber);}
  .radius-row{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:12px;color:var(--muted);}
  .radius-row input[type=range]{flex:1;accent-color:var(--amber);}
  .radius-row .val{font-family:'IBM Plex Mono',monospace;color:var(--ink);min-width:44px;text-align:right;}
  #list{flex:1;overflow-y:auto;padding:6px 0;}
  .row{padding:10px 20px;border-bottom:1px solid #1c232a;cursor:pointer;display:flex;gap:9px;align-items:flex-start;}
  .row:hover{background:var(--panel-2);}
  .row.selected{background:#232b33;border-left:2px solid var(--amber);padding-left:18px;}
  .row .dot{width:9px;height:9px;border-radius:50%;margin-top:5px;flex-shrink:0;}
  .row .rmain{min-width:0;flex:1;}
  .row .name{font-size:13px;font-weight:500;color:var(--ink);}
  .row .name.closedname{color:var(--muted);text-decoration:line-through;}
  .row .addr{font-size:10.5px;color:var(--muted);margin-top:2px;line-height:1.4;}
  .row .meta{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--muted);margin-top:4px;display:flex;gap:8px;flex-wrap:wrap;}
  .row .meta b{color:var(--amber);font-weight:500;}
  .row .badge2{font-size:9px;padding:1px 6px;border-radius:3px;background:var(--closed);color:#fff;margin-left:6px;}
  #list::-webkit-scrollbar{width:8px;}
  #list::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px;}
  #map{width:100%;height:100%;background:#0d1114;}
  .leaflet-popup-content-wrapper{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:8px;}
  .leaflet-popup-tip{background:var(--panel);border:1px solid var(--line);}
  .leaflet-popup-content{margin:14px 16px;font-family:'IBM Plex Sans KR',sans-serif;}
  .pp-eyebrow{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--amber);letter-spacing:.08em;text-transform:uppercase;}
  .pp-title{font-size:15px;font-weight:600;margin:4px 0 6px;}
  .pp-addr{font-size:11.5px;color:var(--muted);margin-bottom:10px;line-height:1.4;}
  .pp-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;font-size:12px;}
  .pp-grid .k{color:var(--muted);font-size:10.5px;}
  .pp-grid .v{font-family:'IBM Plex Mono',monospace;font-weight:500;margin-top:1px;}
  .pp-period{margin-top:10px;padding-top:8px;border-top:1px solid var(--line);font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted);}
  .pp-closed{margin-top:6px;font-size:11px;color:#e08a8a;font-weight:600;}
  .pin-label{font-family:'IBM Plex Mono',monospace;font-size:9px;font-weight:600;color:#fff;}
  .leaflet-control-attribution{background:rgba(24,30,36,.85)!important;color:var(--muted)!important;}
  .leaflet-control-attribution a{color:var(--muted)!important;}
  .leaflet-control-zoom a{background:var(--panel)!important;color:var(--ink)!important;border-color:var(--line)!important;}
</style>
</head>
<body>
<div id="app">
  <div id="sidebar">
    <div id="head">
      <div class="eyebrow">Multi-Brand Portfolio</div>
      <h1>브랜드 매장 현황판</h1>
      <div class="sub">웰라운지 · 웰카페 · 셀루닉하우스 · 나비엘 · 클럽밸런스</div>
    </div>
    <div id="stats">
      <div class="stat"><div class="n" id="stat-count">-</div><div class="l">표시중</div></div>
      <div class="stat"><div class="n" id="stat-active">-</div><div class="l">영업중</div></div>
      <div class="stat"><div class="n" id="stat-closed">-</div><div class="l">폐점</div></div>
    </div>
    <div id="controls">
      <input id="search" type="text" placeholder="매장명 · 주소 검색">
      <div id="brandFilters"></div>
      <div class="toggle-row">
        <span>폐점 매장 표시</span>
        <input type="checkbox" id="closedToggle" checked>
      </div>
      <div class="radius-row">
        <span>영업반경</span>
        <input type="range" id="radiusSlider" min="200" max="3000" step="100" value="1000">
        <span class="val" id="radiusVal">1.0km</span>
      </div>
      <div class="toggle-row">
        <span>반경 원 표시</span>
        <input type="checkbox" id="radiusToggle" checked>
      </div>
    </div>
    <div id="list"></div>
  </div>
  <div id="map"></div>
</div>

const BRAND_COLOR = {wellounge:"#5b8fa8",wellcafe:"#c97b4a",celunic:"#7a9e73",naviel:"#b06a7a",club:"#8d78b0"};
const BRAND_LABEL = {wellounge:"웰라운지",wellcafe:"웰카페",celunic:"셀루닉하우스",naviel:"나비엘",club:"클럽밸런스"};
const CLOSED_COLOR = "#5a6068";

const fmtWon = n => {
  if(n==null) return null;
  if(n>=100000000) return (n/100000000).toFixed(n%100000000===0?0:1)+"억";
  if(n>=10000) return Math.round(n/10000).toLocaleString('ko-KR')+"만";
  return n.toLocaleString('ko-KR');
};
const fmtDate = d => d? d.slice(2).replace(/-/g,'.') : null;

const map = L.map('map', {zoomControl:true, attributionControl:true}).setView([36.4, 127.7], 7);
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
  attribution: '&copy; OpenStreetMap &copy; CARTO', subdomains: 'abcd', maxZoom: 19
}).addTo(map);

let activeBrands = new Set(Object.keys(BRAND_COLOR));
let showClosed = true;
let radius = 1000;
let showRadius = true;
let selectedIdx = null;

function markerColor(s){ return s.closed ? CLOSED_COLOR : BRAND_COLOR[s.brand]; }

function makeIcon(s, dim){
  const color = markerColor(s);
  const shape = s.closed
    ? `<div style="width:18px;height:18px;border-radius:3px;background:${color};border:2px solid #8a8f96;display:flex;align-items:center;justify-content:center;opacity:${dim?0.3:0.9};transform:rotate(45deg);"><span style="transform:rotate(-45deg);color:#fff;font-size:11px;font-weight:700;line-height:1;">&times;</span></div>`
    : `<div style="width:20px;height:20px;border-radius:50% 50% 50% 0;background:${color};transform:rotate(-45deg);box-shadow:0 0 0 2px rgba(0,0,0,.4);opacity:${dim?0.3:1};"></div>`;
  return L.divIcon({className:'', html:shape, iconSize:[20,20], iconAnchor:[10,20], popupAnchor:[0,-18]});
}

function popupHtml(s){
  const hasLease = s.deposit != null;
  return `<div class="pp-eyebrow">${BRAND_LABEL[s.brand]}${s.closed?' · 폐점':''}</div>
    <div class="pp-title">${s.name}</div>
    <div class="pp-addr">${s.addr||'주소 미기재'}</div>
    ${hasLease ? `<div class="pp-grid">
      <div><div class="k">보증금</div><div class="v">${fmtWon(s.deposit)}원</div></div>
      <div><div class="k">월 임차료</div><div class="v">${fmtWon(s.rent)}원</div></div>
    </div>
    <div class="pp-period">계약기간 &nbsp;${fmtDate(s.start)} ~ ${fmtDate(s.end)}</div>` : ''}
    ${s.closed ? '<div class="pp-closed">폐점 매장</div>' : ''}`;
}

const markers = []; const circles = [];
STORES2.forEach((s, idx) => {
  if(s.lat==null){ markers.push(null); circles.push(null); return; }
  const marker = L.marker([s.lat, s.lng], {icon: makeIcon(s, false)}).addTo(map);
  marker.bindPopup(popupHtml(s));
  marker.on('click', () => selectRow(idx));
  markers.push(marker);
  const c = markerColor(s);
  const circle = L.circle([s.lat, s.lng], {radius: radius, color: c, weight:1, fillColor: c, fillOpacity:0.05, opacity:0.4}).addTo(map);
  circles.push(circle);
});

function passesFilter(s){
  if(!activeBrands.has(s.brand)) return false;
  if(s.closed && !showClosed) return false;
  return true;
}

function refreshRadius(){
  circles.forEach((c,i) => { if(!c) return; c.setRadius(radius);
    const on = passesFilter(STORES2[i]) && showRadius;
    c.setStyle({opacity: on?0.4:0, fillOpacity: on?0.05:0}); });
}

function refreshMarkers(){
  STORES2.forEach((s,idx) => {
    if(!markers[idx]) return;
    const dim = !passesFilter(s);
    markers[idx].setIcon(makeIcon(s, dim));
  });
  refreshRadius();
}

const filtersEl = document.getElementById('brandFilters');
Object.keys(BRAND_COLOR).forEach(brand => {
  const chip = document.createElement('div');
  chip.className = 'chip active';
  chip.style.background = BRAND_COLOR[brand];
  chip.style.color = '#12161a';
  chip.style.borderColor = BRAND_COLOR[brand];
  chip.textContent = BRAND_LABEL[brand];
  chip.addEventListener('click', () => {
    if(activeBrands.has(brand)){ activeBrands.delete(brand); chip.classList.remove('active'); chip.style.background='transparent'; chip.style.color=BRAND_COLOR[brand]; }
    else{ activeBrands.add(brand); chip.classList.add('active'); chip.style.background=BRAND_COLOR[brand]; chip.style.color='#12161a'; }
    renderList(); refreshMarkers();
  });
  filtersEl.appendChild(chip);
});

const listEl = document.getElementById('list');
function renderList(){
  const q = document.getElementById('search').value.trim().toLowerCase();
  listEl.innerHTML = '';
  let shown=0;
  STORES2.forEach((s, idx) => {
    if(!passesFilter(s)) return;
    if(q && !(s.name.toLowerCase().includes(q) || (s.addr||'').toLowerCase().includes(q))) return;
    shown++;
    const row = document.createElement('div');
    row.className = 'row' + (selectedIdx===idx?' selected':'');
    row.innerHTML = `<div class="dot" style="background:${markerColor(s)}"></div>
      <div class="rmain">
        <div class="name${s.closed?' closedname':''}">${s.name}${s.closed?'<span class="badge2">폐점</span>':''}</div>
        <div class="addr">${s.addr||'주소 미기재'}</div>
        ${s.deposit!=null ? `<div class="meta"><span><b>${fmtWon(s.deposit)}</b>원</span><span>월 <b>${fmtWon(s.rent)}</b>원</span><span>${fmtDate(s.start)}~${fmtDate(s.end)}</span></div>` : ''}
      </div>`;
    row.addEventListener('click', () => selectRow(idx));
    listEl.appendChild(row);
  });
  document.getElementById('stat-count').textContent = shown;
}

function selectRow(idx){
  selectedIdx = idx; renderList();
  const s = STORES2[idx];
  if(s.lat!=null){ map.flyTo([s.lat, s.lng], 13, {duration:0.6}); markers[idx].openPopup(); }
}

document.getElementById('search').addEventListener('input', renderList);
document.getElementById('closedToggle').addEventListener('change', e => { showClosed = e.target.checked; renderList(); refreshMarkers(); });
const slider = document.getElementById('radiusSlider');
const radiusVal = document.getElementById('radiusVal');
slider.addEventListener('input', () => { radius = parseInt(slider.value); radiusVal.textContent = (radius/1000).toFixed(1)+"km"; refreshRadius(); });
document.getElementById('radiusToggle').addEventListener('change', e => { showRadius = e.target.checked; refreshRadius(); });

document.getElementById('stat-active').textContent = STORES2.filter(s=>!s.closed).length;
document.getElementById('stat-closed').textContent = STORES2.filter(s=>s.closed).length;
renderList();
</script>
